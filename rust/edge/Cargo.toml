[workspace]
members = ["crates/edge-protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# The repository's pinned Nix shell is the toolchain authority.
rust-version = "1.95"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
